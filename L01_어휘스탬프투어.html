<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 1 어휘 스탬프 투어</title>
<style>
:root{
  --ink:#10333F;        /* 군청 - 깊은 바다 */
  --ink-soft:#3A5C68;
  --paper:#E9EFEC;      /* 바다 안개 */
  --card:#FBFCFB;
  --seal:#C8452D;       /* 단청 주홍 */
  --jade:#2F7A6B;       /* 단청 청록 */
  --gold:#D9A441;       /* 단청 황 */
  --line:#C6D3CE;
  --shadow:0 2px 0 rgba(16,51,63,.10);
  --display:Georgia,'Times New Roman','Apple SD Gothic Neo',serif;
  --body:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',
         'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--body);
  line-height:1.6; padding:clamp(16px,3vw,32px) clamp(14px,4vw,24px) 64px;
  display:flex; justify-content:center;
}
.wrap{width:100%; max-width:880px}

/* ── 머리 ───────────────────────────── */
.eyebrow{
  font-family:var(--display); font-size:13px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--jade); font-weight:700;
}
h1{
  font-family:var(--display); font-size:clamp(30px,6.5vw,48px); font-weight:700;
  line-height:1.14; letter-spacing:-.01em; margin:6px 0 4px;
}
h1 .en{display:block; color:var(--seal); font-style:italic; font-size:.62em; letter-spacing:.01em}
.sub{color:var(--ink-soft); font-size:15px}

.meter{display:flex; align-items:center; gap:12px; margin:20px 0 26px}
.bar{flex:1; height:10px; background:#D7E1DD; border-radius:99px; overflow:hidden}
.bar i{
  display:block; height:100%; width:0%; background:var(--seal);
  border-radius:99px; transition:width .45s cubic-bezier(.4,1.3,.5,1);
}
.count{font-family:var(--display); font-size:19px; font-weight:700; white-space:nowrap}
.count b{color:var(--seal); font-size:1.24em}

/* ── 모드 탭 ─────────────────────────── */
.tabs{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap}
.tab{
  flex:1 1 150px; min-height:52px; padding:12px 10px; cursor:pointer;
  background:transparent; border:1.5px solid var(--line); border-radius:12px;
  font:inherit; font-size:16px; font-weight:600; color:var(--ink-soft);
  transition:background .18s,color .18s,border-color .18s;
}
.tab:hover{border-color:var(--jade); color:var(--jade)}
.tab[aria-selected="true"]{background:var(--ink); border-color:var(--ink); color:#fff}
.tab:focus-visible,button:focus-visible,input:focus-visible{
  outline:3px solid var(--gold); outline-offset:2px
}

/* ── 무대 ───────────────────────────── */
.stage{
  background:var(--card); border:1.5px solid var(--line); border-radius:18px;
  box-shadow:var(--shadow); padding:clamp(22px,5vw,40px);
  min-height:330px; display:flex; flex-direction:column;
  justify-content:center; text-align:center;
}
.idx{
  font-family:var(--display); font-size:13px; letter-spacing:.15em;
  color:var(--ink-soft); margin-bottom:14px;
}
.word{
  font-family:var(--display); font-size:clamp(34px,8.5vw,60px); font-weight:700;
  line-height:1.1; word-break:break-word;
}
.pos{
  display:inline-block; margin-bottom:10px; padding:3px 11px; border-radius:99px;
  background:#E4EDE9; color:var(--jade); font-size:13px; font-weight:700;
}
.mean{
  font-size:clamp(24px,5.5vw,34px); font-weight:700; color:var(--seal); margin-top:6px;
}
.ex{
  margin-top:20px; padding-top:18px; border-top:1px dashed var(--line);
  font-family:var(--display); font-size:clamp(16px,3.6vw,20px); color:var(--ink-soft);
}
.ex b{color:var(--ink); font-style:normal}
.hint{color:var(--ink-soft); font-size:14px; margin-top:18px}

/* ── 버튼 ───────────────────────────── */
.row{display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap}
button{font:inherit; cursor:pointer; border-radius:11px; transition:transform .1s, background .18s}
button:active{transform:translateY(1px)}
.btn{
  min-height:50px; padding:12px 24px; font-size:16px; font-weight:600;
  background:var(--ink); color:#fff; border:1.5px solid var(--ink);
}
.btn:hover{background:#1B4A5A}
.btn.ghost{background:transparent; color:var(--ink); }
.btn.ghost:hover{background:#DDE7E3}

/* ── 4지선다 ─────────────────────────── */
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:26px}
@media(max-width:540px){.opts{grid-template-columns:1fr}}
.opt{
  min-height:62px; padding:14px 16px; text-align:left; font-size:17px; font-weight:600;
  background:#F2F6F4; border:1.5px solid var(--line); color:var(--ink);
  display:flex; align-items:center; gap:11px;
}
.opt:hover:not(:disabled){border-color:var(--jade); background:#E8F0ED}
.opt span{
  flex:none; width:26px; height:26px; border-radius:50%; background:#fff;
  border:1.5px solid var(--line); font-size:13px; font-weight:700;
  display:grid; place-items:center; color:var(--ink-soft);
}
.opt.yes{background:#E3F1EC; border-color:var(--jade); color:var(--jade)}
.opt.yes span{background:var(--jade); border-color:var(--jade); color:#fff}
.opt.no{background:#FAE9E5; border-color:var(--seal); color:var(--seal)}
.opt.no span{background:var(--seal); border-color:var(--seal); color:#fff}
.opt:disabled{cursor:default}

/* ── 철자 입력 ───────────────────────── */
.spellbox{display:flex; gap:10px; justify-content:center; margin-top:24px; flex-wrap:wrap}
input[type=text]{
  font:inherit; font-family:var(--display); font-size:26px; text-align:center;
  padding:12px 16px; width:min(340px,100%); min-height:58px;
  background:#F2F6F4; border:1.5px solid var(--line); border-radius:11px; color:var(--ink);
}
.verdict{margin-top:18px; font-size:18px; font-weight:700; min-height:28px}
.verdict.ok{color:var(--jade)}
.verdict.bad{color:var(--seal)}
.verdict small{display:block; font-weight:500; color:var(--ink-soft); margin-top:4px;
  font-size:15px; font-family:var(--display)}

/* ── 스탬프판 (시그니처) ──────────────── */
.board{margin-top:38px}
.board h2{
  font-family:var(--display); font-size:20px; font-weight:700;
  display:flex; align-items:baseline; gap:10px; margin-bottom:4px;
}
.board h2 em{font-style:normal; font-size:14px; color:var(--ink-soft); font-family:var(--body)}
.board p{color:var(--ink-soft); font-size:14px; margin-bottom:18px}
.stamps{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:12px;
}
.stamp{
  aspect-ratio:1; border-radius:50%; display:grid; place-items:center;
  border:2px dashed var(--line); background:transparent; text-align:center;
  padding:6px; line-height:1.2;
}
.stamp em{font-style:normal; font-size:11px; color:#9BAAA5; font-weight:600; word-break:break-all}
.stamp.got{
  border:2.5px solid var(--seal); border-style:solid; color:var(--seal);
  background:rgba(200,69,45,.07);
  animation:press .4s cubic-bezier(.3,1.6,.5,1);
}
.stamp.got em{color:var(--seal); font-family:var(--display); font-size:12px; font-weight:700}
@keyframes press{
  0%{transform:scale(1.5) rotate(-12deg); opacity:0}
  60%{transform:scale(.94) rotate(2deg); opacity:1}
  100%{transform:scale(1) rotate(-3deg)}
}
.stamp.got{transform:rotate(-3deg)}

.done{
  margin-top:26px; padding:22px; border-radius:14px; text-align:center;
  background:var(--ink); color:#fff; display:none;
}
.done.on{display:block}
.done strong{font-family:var(--display); font-size:24px; display:block; margin-bottom:6px}
.done span{color:#A9C4BC; font-size:15px}

footer{margin-top:34px; color:var(--ink-soft); font-size:13px; text-align:center}

@media(prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:9999;background:#E9EFEC;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#FBFCFB;border:1.5px solid #C6D3CE;border-radius:18px;padding:40px 32px;max-width:360px;width:100%;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;box-shadow:0 2px 0 rgba(16,51,63,.10);">
    <p style="font-family:Georgia,'Times New Roman','Apple SD Gothic Neo',serif;font-size:22px;font-weight:700;color:#10333F;margin-bottom:8px;">🔒 비밀번호 확인</p>
    <p style="color:#3A5C68;font-size:14px;margin-bottom:20px;">선생님께 받은 비밀번호를 입력하세요.</p>
    <input id="gate-pw" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호" style="width:100%;padding:12px 14px;font-size:18px;text-align:center;border:1.5px solid #C6D3CE;border-radius:11px;background:#F2F6F4;color:#10333F;box-sizing:border-box;">
    <button id="gate-btn" style="margin-top:14px;width:100%;padding:12px;font-size:16px;font-weight:600;background:#10333F;color:#fff;border:none;border-radius:11px;cursor:pointer;">확인</button>
    <p id="gate-err" style="color:#C8452D;font-size:13px;margin-top:10px;min-height:18px;"></p>
  </div>
</div>
<script>
(function(){
  var PW = "19450815";
  var gate = document.getElementById('gate');
  if (sessionStorage.getItem('stampGateOK') === '1') {
    gate.remove();
    return;
  }
  function tryUnlock(){
    var v = document.getElementById('gate-pw').value.trim();
    if (v === PW) {
      sessionStorage.setItem('stampGateOK','1');
      gate.remove();
    } else {
      document.getElementById('gate-err').textContent = '비밀번호가 올바르지 않아요.';
      document.getElementById('gate-pw').value = '';
      document.getElementById('gate-pw').focus();
    }
  }
  document.getElementById('gate-btn').addEventListener('click', tryUnlock);
  document.getElementById('gate-pw').addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
})();
</script>

<div class="wrap">

  <p class="eyebrow">Lesson 1 · 1학년 영어</p>
  <h1>어휘 스탬프 투어<span class="en">Collect all 25 stamps</span></h1>
  <p class="sub">단어를 맞힐 때마다 스탬프가 하나씩 찍힙니다. 25개를 모두 모아 보세요.</p>

  <div class="meter">
    <div class="bar"><i id="fill"></i></div>
    <div class="count"><b id="got">0</b> / 25</div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  data-mode="card">단어장</button>
    <button class="tab" role="tab" aria-selected="false" data-mode="quiz">뜻 맞히기</button>
    <button class="tab" role="tab" aria-selected="false" data-mode="spell">철자 쓰기</button>
  </div>

  <div class="stage" id="stage"></div>

  <section class="board">
    <h2>스탬프판 <em>맞힌 단어에 도장이 찍혀요</em></h2>
    <p>‘뜻 맞히기’나 ‘철자 쓰기’에서 정답을 맞히면 그 단어의 스탬프를 얻습니다.</p>
    <div class="stamps" id="stamps"></div>
    <div class="done" id="done">
      <strong>스탬프 25개 완성!</strong>
      <span>Lesson 1 어휘를 모두 익혔어요. 선생님께 보여 주세요.</span>
    </div>
  </section>

  <footer>기록은 이 화면을 닫으면 사라집니다. 한 번에 이어서 해 보세요.</footer>
</div>

<script>
const DATA = [
 {w:"active",       p:"형", m:"활동적인",     ex:"He is old but active."},
 {w:"cartoon",      p:"명", m:"만화",         ex:"Jin watches cartoons after dinner."},
 {w:"character",    p:"명", m:"등장인물",     ex:"Who is your favorite cartoon character?"},
 {w:"conversation", p:"명", m:"대화",         ex:"We have conversations in English."},
 {w:"cotton candy", p:"명", m:"솜사탕",       ex:"Emily eats cotton candy every Sunday."},
 {w:"creative",     p:"형", m:"창의적인",     ex:"He has a lot of creative ideas."},
 {w:"easily",       p:"부", m:"쉽게",         ex:"She learns new words easily."},
 {w:"enjoy",        p:"동", m:"즐기다",       ex:"Many people enjoy the magic show."},
 {w:"friendly",     p:"형", m:"친절한",       ex:"My classmates are friendly to me."},
 {w:"honeybee",     p:"명", m:"꿀벌",         ex:"Honeybees fly from flower to flower."},
 {w:"horror",       p:"명", m:"공포",         ex:"My dad doesn\u2019t like horror movies."},
 {w:"interesting",  p:"형", m:"재미있는, 흥미로운", ex:"This book is interesting."},
 {w:"liar",         p:"명", m:"거짓말쟁이",   ex:"I don\u2019t trust a liar like Pinocchio."},
 {w:"patient",      p:"형", m:"참을성 있는",  ex:"Ms. Kim is a very patient teacher."},
 {w:"perfect",      p:"형", m:"완벽한, 완전한", ex:"It is a perfect day for a picnic."},
 {w:"poster",       p:"명", m:"포스터",       ex:"This poster is about the book festival."},
 {w:"really",       p:"부", m:"정말로, 아주", ex:"This bag is really cheap!"},
 {w:"share",        p:"동", m:"공유하다, 나누다", ex:"We share ideas at meetings."},
 {w:"smart",        p:"형", m:"똑똑한, 영리한", ex:"Dolphins are very smart."},
 {w:"subject",      p:"명", m:"과목",         ex:"My favorite subject is English."},
 {w:"sweet",        p:"형", m:"달콤한, 상냥한, 단것", ex:"This cake is sweet."},
 {w:"thought",      p:"명", m:"생각",         ex:"People share their thoughts online."},
 {w:"turtle",       p:"명", m:"바다거북",     ex:"Turtles have a hard shell."},
 {w:"a lot",        p:"",   m:"많이",         ex:"Tom likes Korean food a lot."},
 {w:"in harmony with", p:"", m:"~와 조화하여, 협조하여", ex:"They live in harmony with nature."}
];

const stage = document.getElementById('stage');
const stampsEl = document.getElementById('stamps');
const earned = new Set();
let mode = 'card', ci = 0, flipped = false;
let qi = 0, answered = false, qOpts = [], sChecked = false;

/* 예문 안의 목표 어휘를 굵게 */
function bold(item){
  const base = item.w.replace(/\s+/g,'\\s+');
  const re = new RegExp('('+base+'\\w*)','i');
  return item.ex.replace(re,'<b>$1</b>');
}
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

/* ── 스탬프판 ── */
function buildStamps(){
  stampsEl.innerHTML = DATA.map((d,i)=>
    `<div class="stamp" id="st${i}"><em>${d.w}</em></div>`).join('');
}
function award(i){
  if(earned.has(i)) return;
  earned.add(i);
  document.getElementById('st'+i).classList.add('got');
  document.getElementById('got').textContent = earned.size;
  document.getElementById('fill').style.width = (earned.size/DATA.length*100)+'%';
  if(earned.size===DATA.length) document.getElementById('done').classList.add('on');
}

/* ── 1. 단어장 ── */
function viewCard(){
  const d = DATA[ci];
  stage.innerHTML = flipped ? `
    <p class="idx">${ci+1} / ${DATA.length}</p>
    ${d.p?`<div><span class="pos">${d.p}</span></div>`:''}
    <p class="mean">${d.m}</p>
    <p class="ex">${bold(d)}</p>
    <div class="row">
      <button class="btn ghost" data-a="prev">← 이전</button>
      <button class="btn ghost" data-a="flip">단어 보기</button>
      <button class="btn" data-a="next">다음 →</button>
    </div>` : `
    <p class="idx">${ci+1} / ${DATA.length}</p>
    <p class="word">${d.w}</p>
    <p class="hint">뜻이 떠올랐나요? 눌러서 확인하세요.</p>
    <div class="row">
      <button class="btn ghost" data-a="prev">← 이전</button>
      <button class="btn" data-a="flip">뜻 보기</button>
      <button class="btn ghost" data-a="next">다음 →</button>
    </div>`;
}

/* ── 2. 뜻 맞히기 ── */
function newQuiz(){
  answered = false;
  const wrong = shuffle(DATA.filter((_,i)=>i!==qi)).slice(0,3).map(d=>d.m);
  qOpts = shuffle([DATA[qi].m, ...wrong]);
  viewQuiz();
}
function viewQuiz(){
  const d = DATA[qi];
  stage.innerHTML = `
    <p class="idx">뜻 맞히기 · ${qi+1} / ${DATA.length}</p>
    <p class="word">${d.w}</p>
    <div class="opts">${qOpts.map((o,j)=>
      `<button class="opt" data-o="${j}"><span>${j+1}</span>${o}</button>`).join('')}</div>
    <div class="row"><button class="btn ghost" data-a="skip">다음 단어 →</button></div>`;
}

/* ── 3. 철자 쓰기 ── */
function viewSpell(){
  const d = DATA[qi];
  const tip = d.w[0] + ' ' + d.w.slice(1).replace(/[a-z]/g,'_');
  stage.innerHTML = `
    <p class="idx">철자 쓰기 · ${qi+1} / ${DATA.length}</p>
    ${d.p?`<div><span class="pos">${d.p}</span></div>`:''}
    <p class="mean">${d.m}</p>
    <p class="hint">첫 글자 힌트 &nbsp; <b style="font-family:var(--display);font-size:19px">${tip}</b></p>
    <div class="spellbox">
      <input type="text" id="ip" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="영어로 쓰기" aria-label="영어 단어 입력">
      <button class="btn" data-a="check">확인</button>
    </div>
    <p class="verdict" id="vd" role="status"></p>
    <div class="row"><button class="btn ghost" data-a="skip">다음 단어 →</button></div>`;
  const ip = document.getElementById('ip');
  ip.focus();
  ip.addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });
}
function check(){
  const ip = document.getElementById('ip'), vd = document.getElementById('vd');
  const d = DATA[qi];
  const norm = s => s.trim().toLowerCase().replace(/\s+/g,' ');
  if(!norm(ip.value)) return;
  if(norm(ip.value) === norm(d.w)){
    vd.className='verdict ok'; vd.innerHTML='맞았어요! 스탬프 획득';
    award(qi); sChecked=true;
    setTimeout(()=>{ qi=(qi+1)%DATA.length; viewSpell(); }, 900);
  } else {
    vd.className='verdict bad';
    vd.innerHTML='다시 한 번 <small>정답 : '+d.w+'</small>';
  }
}

/* ── 전환 ── */
function render(){
  if(mode==='card') viewCard();
  else if(mode==='quiz') newQuiz();
  else viewSpell();
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));
    t.setAttribute('aria-selected','true');
    mode = t.dataset.mode; ci=0; qi=0; flipped=false;
    render();
  });
});

stage.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const a = b.dataset.a;
  if(a==='flip'){ flipped=!flipped; viewCard(); }
  else if(a==='next'){ ci=(ci+1)%DATA.length; flipped=false; viewCard(); }
  else if(a==='prev'){ ci=(ci-1+DATA.length)%DATA.length; flipped=false; viewCard(); }
  else if(a==='check'){ check(); }
  else if(a==='skip'){ qi=(qi+1)%DATA.length; mode==='quiz'?newQuiz():viewSpell(); }
  else if(b.dataset.o!==undefined){
    if(answered) return;
    answered = true;
    const pick = qOpts[+b.dataset.o], right = DATA[qi].m;
    document.querySelectorAll('.opt').forEach((o,j)=>{
      o.disabled = true;
      if(qOpts[j]===right) o.classList.add('yes');
      else if(j===+b.dataset.o) o.classList.add('no');
    });
    if(pick===right) award(qi);
    setTimeout(()=>{ qi=(qi+1)%DATA.length; newQuiz(); }, 1000);
  }
});

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(mode==='card'){
    if(e.key==='ArrowRight'){ ci=(ci+1)%DATA.length; flipped=false; viewCard(); }
    if(e.key==='ArrowLeft'){ ci=(ci-1+DATA.length)%DATA.length; flipped=false; viewCard(); }
    if(e.key===' '){ e.preventDefault(); flipped=!flipped; viewCard(); }
  }
  if(mode==='quiz' && '1234'.includes(e.key)){
    const b = document.querySelector('.opt[data-o="'+(+e.key-1)+'"]');
    if(b) b.click();
  }
});

buildStamps();
render();
